<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="A mouse works today, and other input devices could in future feed the same engine that drives a PS5 thumbstick"><title>A mouse works today, and other input devices could in future feed the same engine that drives a PS5 thumbstick</title>
<style>
  /* GitHub dark: page #0d1117, cards #161b22, borders #30363d. Data colors validated for dark surfaces. */
  .panel{fill:#0d1117;stroke:#21262d;stroke-width:1}.ink{fill:#e6edf3}.mut{fill:#8b949e}
  .grid{stroke:#21262d;stroke-width:1}.axis{stroke:#484f58;stroke-width:1}
  .a{stroke:#388bfd}.b{stroke:#db6d28}.g{stroke:#6e7681}.af{fill:#388bfd}.bf{fill:#db6d28}.gf{fill:#6e7681}
  .afade{fill:#388bfd;opacity:.16}.bfade{fill:#db6d28;opacity:.16}
  .soft{fill:#161b22;stroke:#30363d;stroke-width:1}.line{fill:none;stroke-width:2.75;stroke-linecap:round;stroke-linejoin:round}
  .onacc{fill:#0d1117}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
</style><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#1b2029"/></pattern><linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#388bfd"/><stop offset="1" stop-color="#db6d28"/></linearGradient></defs><rect class="panel" x=".5" y=".5" width="999" height="399" rx="14"/><rect width="1000" height="400" rx="14" fill="url(#dots)"/><rect x="28" y="0" width="64" height="3" rx="1.5" fill="url(#bar)"/><text x="28.0" y="42.0" class="ink" font-size="21" font-weight="800" text-anchor="start" >Anything that moves could become a stick.</text><text x="28.0" y="64.0" class="mut" font-size="13.5" font-weight="400" text-anchor="start" >The engine only needs to know how far something moved. It doesn&#x27;t care what moved it.</text><rect class="soft" x="40" y="96" width="230" height="44" rx="12"/><rect class="a" x="40" y="96" width="230" height="44" rx="12" fill="none" stroke-width="2.5" /><text x="60.0" y="124.0" class="ink" font-size="14.5" font-weight="700" text-anchor="start" >Mouse</text><text x="254.0" y="124.0" class="ink" font-size="12" font-weight="700" text-anchor="end" >works today</text><path class="g" d="M270,118 C330,118 340,236 400,236" fill="none" stroke-width="2" /><rect class="soft" x="40" y="152" width="230" height="44" rx="12"/><rect class="g" x="40" y="152" width="230" height="44" rx="12" fill="none" stroke-width="2.5" stroke-dasharray="6 5"/><text x="60.0" y="180.0" class="ink" font-size="14.5" font-weight="700" text-anchor="start" >Trackball</text><text x="254.0" y="180.0" class="mut" font-size="12" font-weight="400" text-anchor="end" >idea</text><path class="g" d="M270,174 C330,174 340,236 400,236" fill="none" stroke-width="2" stroke-dasharray="6 5"/><rect class="soft" x="40" y="208" width="230" height="44" rx="12"/><rect class="g" x="40" y="208" width="230" height="44" rx="12" fill="none" stroke-width="2.5" stroke-dasharray="6 5"/><text x="60.0" y="236.0" class="ink" font-size="14.5" font-weight="700" text-anchor="start" >Head tracker</text><text x="254.0" y="236.0" class="mut" font-size="12" font-weight="400" text-anchor="end" >idea</text><path class="g" d="M270,230 C330,230 340,236 400,236" fill="none" stroke-width="2" stroke-dasharray="6 5"/><rect class="soft" x="40" y="264" width="230" height="44" rx="12"/><rect class="g" x="40" y="264" width="230" height="44" rx="12" fill="none" stroke-width="2.5" stroke-dasharray="6 5"/><text x="60.0" y="292.0" class="ink" font-size="14.5" font-weight="700" text-anchor="start" >Phone gyro</text><text x="254.0" y="292.0" class="mut" font-size="12" font-weight="400" text-anchor="end" >idea</text><path class="g" d="M270,286 C330,286 340,236 400,236" fill="none" stroke-width="2" stroke-dasharray="6 5"/><rect class="soft" x="40" y="320" width="230" height="44" rx="12"/><rect class="g" x="40" y="320" width="230" height="44" rx="12" fill="none" stroke-width="2.5" stroke-dasharray="6 5"/><text x="60.0" y="348.0" class="ink" font-size="14.5" font-weight="700" text-anchor="start" >Adaptive device</text><text x="254.0" y="348.0" class="mut" font-size="12" font-weight="400" text-anchor="end" >idea</text><path class="g" d="M270,342 C330,342 340,236 400,236" fill="none" stroke-width="2" stroke-dasharray="6 5"/><g transform="translate(400,176)"><rect class="soft" width="230" height="120" rx="16"/><rect class="b" width="230" height="120" rx="16" fill="none" stroke-width="3"/><text x="115.0" y="50.0" class="ink" font-size="17" font-weight="800" text-anchor="middle" >Nullwire engine</text><text x="115.0" y="74.0" class="mut" font-size="12.5" font-weight="400" text-anchor="middle" >movement in,</text><text x="115.0" y="92.0" class="mut" font-size="12.5" font-weight="400" text-anchor="middle" >thumbstick pushes out</text></g><path class="g" d="M630,236 H730" stroke-width="3" fill="none" stroke-dasharray="2 7" stroke-linecap="round"/><path class="gf" d="M726,227 L744,236 L726,245 Z"/><g transform="translate(850,236)"><circle class="soft" r="64"/><circle class="b" r="64" fill="none" stroke-width="3"/><circle class="grid" r="42" fill="none" stroke-dasharray="3 5"/><circle class="bf" cx="-20" cy="-22" r="24"/></g><text x="850.0" y="330.0" class="ink" font-size="14" font-weight="700" text-anchor="middle" >any PS5 game</text><text x="850.0" y="348.0" class="mut" font-size="12" font-weight="400" text-anchor="middle" >that reads a stick</text><text x="500.0" y="386.0" class="mut" font-size="11.5" font-weight="400" text-anchor="middle" >Only the mouse exists today. The rest are ideas the design makes possible, not features we have built.</text></svg>