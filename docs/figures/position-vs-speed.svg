<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="A mouse commands a position while a thumbstick commands a turning speed"><title>A mouse commands a position while a thumbstick commands a turning speed</title>
<style>
  .panel{fill:#fcfcfb}.ink{fill:#1a1a19}.mut{fill:#6b6a63}.grid{stroke:#e2e1da;stroke-width:1}.axis{stroke:#9b9a92;stroke-width:1}
  .a{stroke:#2a78d6}.b{stroke:#eb6834}.g{stroke:#8a897f}.af{fill:#2a78d6}.bf{fill:#eb6834}.gf{fill:#8a897f}
  .afade{fill:#2a78d6;opacity:.14}.bfade{fill:#eb6834;opacity:.14}.soft{fill:#efeee8}.line{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .panel{fill:#1a1a19}.ink{fill:#f0efec}.mut{fill:#c3c2b7}.grid{stroke:#34332f}.axis{stroke:#6b6a63}
    .a{stroke:#3987e5}.b{stroke:#d95926}.af{fill:#3987e5}.bf{fill:#d95926}.afade{fill:#3987e5}.bfade{fill:#d95926}.soft{fill:#262522}
  }
</style><rect class="panel" width="1000" height="400" rx="14"/><text x="28.0" y="40.0" class="ink" font-size="20" font-weight="700" text-anchor="start" >A mouse says where. A stick says how fast.</text><text x="28.0" y="62.0" class="mut" font-size="13" font-weight="400" text-anchor="start" >Turning one into the other is the whole problem.</text><g transform="translate(40,92)"><rect class="soft" width="440" height="270" rx="14"/><text x="24.0" y="38.0" class="ink" font-size="17" font-weight="700" text-anchor="start" >Mouse: position</text><text x="24.0" y="64.0" class="mut" font-size="13" font-weight="400" text-anchor="start" >Move it 2 cm and stop.</text><text x="24.0" y="84.0" class="mut" font-size="13" font-weight="400" text-anchor="start" >The camera turns 40° and stops.</text></g><g transform="translate(520,92)"><rect class="soft" width="440" height="270" rx="14"/><text x="24.0" y="38.0" class="ink" font-size="17" font-weight="700" text-anchor="start" >Stick: speed</text><text x="24.0" y="64.0" class="mut" font-size="13" font-weight="400" text-anchor="start" >Hold it right.</text><text x="24.0" y="84.0" class="mut" font-size="13" font-weight="400" text-anchor="start" >The camera keeps turning until you let go.</text></g><g transform="translate(40,92)"><line class="axis" x1="40" x2="400" y1="190" y2="190"/><line class="axis" x1="40" x2="40" y1="190" y2="204"/><line class="axis" x1="80" x2="80" y1="190" y2="198"/><line class="axis" x1="120" x2="120" y1="190" y2="204"/><line class="axis" x1="160" x2="160" y1="190" y2="198"/><line class="axis" x1="200" x2="200" y1="190" y2="204"/><line class="axis" x1="240" x2="240" y1="190" y2="198"/><line class="axis" x1="280" x2="280" y1="190" y2="204"/><line class="axis" x1="320" x2="320" y1="190" y2="198"/><line class="axis" x1="360" x2="360" y1="190" y2="204"/><line class="axis" x1="400" x2="400" y1="190" y2="198"/><rect class="afade" x="40" y="168" width="160" height="22" rx="11"/><circle class="af" cx="200" cy="179" r="10"/><text x="120.0" y="230.0" class="mut" font-size="12" font-weight="400" text-anchor="middle" >hand moves 2 cm</text><path class="a" d="M300,150 A60,60 0 0 1 360,100" fill="none" stroke-width="3" stroke-dasharray="3 5"/><text x="358.0" y="172.0" class="ink" font-size="13" font-weight="700" text-anchor="end" >= 40° turned</text></g><g transform="translate(520,92)"><circle class="soft" cx="90" cy="176" r="50"/><circle class="b" cx="90" cy="176" r="50" fill="none" stroke-width="2.5"/><circle class="bf" cx="112" cy="176" r="19"/><text x="90.0" y="248.0" class="mut" font-size="12" font-weight="400" text-anchor="middle" >hold right</text><line class="axis" x1="200" x2="410" y1="206" y2="206"/><path class="bfade" d="M220,206 V150 H360 V206 Z"/><path class="b" d="M220,206 V150 H360 V206" fill="none" stroke-width="3"/><text x="290.0" y="140.0" class="mut" font-size="12" font-weight="400" text-anchor="middle" >camera speed</text><text x="290.0" y="232.0" class="mut" font-size="12" font-weight="400" text-anchor="middle" >turning the whole time you hold</text></g><text x="500.0" y="386.0" class="ink" font-size="13" font-weight="600" text-anchor="middle" >Nullwire works out how hard to push, and for how long, so the camera ends up exactly where the mouse said.</text></svg>