<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="A mouse commands a position while a thumbstick commands a turning speed"><title>A mouse commands a position while a thumbstick commands a turning speed</title>
<style>
  /* GitHub dark: page #0d1117, cards #161b22, borders #30363d. Data colors validated for dark surfaces. */
  .panel{fill:#0d1117;stroke:#21262d;stroke-width:1}.ink{fill:#e6edf3}.mut{fill:#8b949e}
  .grid{stroke:#21262d;stroke-width:1}.axis{stroke:#484f58;stroke-width:1}
  .a{stroke:#388bfd}.b{stroke:#db6d28}.g{stroke:#6e7681}.af{fill:#388bfd}.bf{fill:#db6d28}.gf{fill:#6e7681}
  .afade{fill:#388bfd;opacity:.16}.bfade{fill:#db6d28;opacity:.16}
  .soft{fill:#161b22;stroke:#30363d;stroke-width:1}.line{fill:none;stroke-width:2.75;stroke-linecap:round;stroke-linejoin:round}
  .onacc{fill:#0d1117}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
</style><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#1b2029"/></pattern><linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#388bfd"/><stop offset="1" stop-color="#db6d28"/></linearGradient></defs><rect class="panel" x=".5" y=".5" width="999" height="399" rx="14"/><rect width="1000" height="400" rx="14" fill="url(#dots)"/><rect x="28" y="0" width="64" height="3" rx="1.5" fill="url(#bar)"/><text x="28.0" y="42.0" class="ink" font-size="21" font-weight="800" text-anchor="start" >A mouse says where. A stick says how fast.</text><text x="28.0" y="64.0" class="mut" font-size="13.5" font-weight="400" text-anchor="start" >Turning one into the other is the whole problem.</text><g transform="translate(40,92)"><rect class="soft" width="440" height="270" rx="14"/><text x="24.0" y="38.0" class="ink" font-size="17" font-weight="700" text-anchor="start" >Mouse: position</text><text x="24.0" y="64.0" class="mut" font-size="13" font-weight="400" text-anchor="start" >Move it 2 cm and stop.</text><text x="24.0" y="84.0" class="mut" font-size="13" font-weight="400" text-anchor="start" >The camera turns 40° and stops.</text></g><g transform="translate(520,92)"><rect class="soft" width="440" height="270" rx="14"/><text x="24.0" y="38.0" class="ink" font-size="17" font-weight="700" text-anchor="start" >Stick: speed</text><text x="24.0" y="64.0" class="mut" font-size="13" font-weight="400" text-anchor="start" >Hold it right.</text><text x="24.0" y="84.0" class="mut" font-size="13" font-weight="400" text-anchor="start" >The camera keeps turning until you let go.</text></g><g transform="translate(40,92)"><line class="axis" x1="40" x2="400" y1="190" y2="190"/><line class="axis" x1="40" x2="40" y1="190" y2="204"/><line class="axis" x1="80" x2="80" y1="190" y2="198"/><line class="axis" x1="120" x2="120" y1="190" y2="204"/><line class="axis" x1="160" x2="160" y1="190" y2="198"/><line class="axis" x1="200" x2="200" y1="190" y2="204"/><line class="axis" x1="240" x2="240" y1="190" y2="198"/><line class="axis" x1="280" x2="280" y1="190" y2="204"/><line class="axis" x1="320" x2="320" y1="190" y2="198"/><line class="axis" x1="360" x2="360" y1="190" y2="204"/><line class="axis" x1="400" x2="400" y1="190" y2="198"/><rect class="afade" x="40" y="168" width="160" height="22" rx="11"/><circle class="af" cx="200" cy="179" r="10"/><text x="120.0" y="230.0" class="mut" font-size="12" font-weight="400" text-anchor="middle" >hand moves 2 cm</text><path class="a" d="M300,150 A60,60 0 0 1 360,100" fill="none" stroke-width="3" stroke-dasharray="3 5"/><text x="358.0" y="172.0" class="ink" font-size="13" font-weight="700" text-anchor="end" >= 40° turned</text></g><g transform="translate(520,92)"><circle class="soft" cx="90" cy="176" r="50"/><circle class="b" cx="90" cy="176" r="50" fill="none" stroke-width="2.5"/><circle class="bf" cx="112" cy="176" r="19"/><text x="90.0" y="248.0" class="mut" font-size="12" font-weight="400" text-anchor="middle" >hold right</text><line class="axis" x1="200" x2="410" y1="206" y2="206"/><path class="bfade" d="M220,206 V150 H360 V206 Z"/><path class="b" d="M220,206 V150 H360 V206" fill="none" stroke-width="3"/><text x="290.0" y="140.0" class="mut" font-size="12" font-weight="400" text-anchor="middle" >camera speed</text><text x="290.0" y="232.0" class="mut" font-size="12" font-weight="400" text-anchor="middle" >turning the whole time you hold</text></g><text x="500.0" y="386.0" class="ink" font-size="13" font-weight="600" text-anchor="middle" >Nullwire works out how hard to push, and for how long, so the camera ends up exactly where the mouse said.</text></svg>