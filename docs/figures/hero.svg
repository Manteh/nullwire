<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-label="A mouse feeds the Nullwire engine, which drives a PS5 thumbstick over Remote Play"><title>A mouse feeds the Nullwire engine, which drives a PS5 thumbstick over Remote Play</title>
<style>
  /* GitHub dark: page #0d1117, cards #161b22, borders #30363d. Data colors validated for dark surfaces. */
  .panel{fill:#0d1117;stroke:#21262d;stroke-width:1}.ink{fill:#e6edf3}.mut{fill:#8b949e}
  .grid{stroke:#21262d;stroke-width:1}.axis{stroke:#484f58;stroke-width:1}
  .a{stroke:#388bfd}.b{stroke:#db6d28}.g{stroke:#6e7681}.af{fill:#388bfd}.bf{fill:#db6d28}.gf{fill:#6e7681}
  .afade{fill:#388bfd;opacity:.16}.bfade{fill:#db6d28;opacity:.16}
  .soft{fill:#161b22;stroke:#30363d;stroke-width:1}.line{fill:none;stroke-width:2.75;stroke-linecap:round;stroke-linejoin:round}
  .onacc{fill:#0d1117}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
</style><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#1b2029"/></pattern><linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#388bfd"/><stop offset="1" stop-color="#db6d28"/></linearGradient></defs><rect class="panel" x=".5" y=".5" width="999" height="349" rx="14"/><rect width="1000" height="350" rx="14" fill="url(#dots)"/><rect x="28" y="0" width="64" height="3" rx="1.5" fill="url(#bar)"/><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#388bfd"/><stop offset="1" stop-color="#db6d28"/></linearGradient><radialGradient id="gb"><stop offset="0" stop-color="#388bfd" stop-opacity=".30"/><stop offset="1" stop-color="#388bfd" stop-opacity="0"/></radialGradient><radialGradient id="go"><stop offset="0" stop-color="#db6d28" stop-opacity=".30"/><stop offset="1" stop-color="#db6d28" stop-opacity="0"/></radialGradient></defs><ellipse cx="170" cy="225" rx="170" ry="120" fill="url(#gb)"/><ellipse cx="850" cy="225" rx="170" ry="120" fill="url(#go)"/><rect x="0" y="0" width="1000" height="5" fill="url(#g)"/><text x="500.0" y="86.0" class="ink" font-size="56" font-weight="800" text-anchor="middle" letter-spacing="-1">Nullwire</text><text x="500.0" y="122.0" class="mut" font-size="20" font-weight="400" text-anchor="middle" >Teach a thumbstick to move like a mouse.</text><g transform="translate(120,160)"><rect class="soft" x="0" y="0" width="86" height="120" rx="40"/><rect class="a" x="0" y="0" width="86" height="120" rx="40" fill="none" stroke-width="3"/><line class="a" x1="43" y1="0" x2="43" y2="46" stroke-width="3"/><rect class="af" x="39" y="14" width="8" height="20" rx="4"/></g><text x="163.0" y="306.0" class="ink" font-size="14" font-weight="700" text-anchor="middle" >Your mouse</text><text x="163.0" y="325.0" class="mut" font-size="12" font-weight="400" text-anchor="middle" >says where to look</text><path class="g" d="M240,220 H330" stroke-width="3" fill="none" stroke-dasharray="2 7" stroke-linecap="round"/><path class="gf" d="M326,211 L344,220 L326,229 Z"/><g transform="translate(352,170)"><rect class="soft" width="296" height="100" rx="16"/><rect fill="none" class="b" width="296" height="100" rx="16" stroke-width="3"/><text x="148.0" y="42.0" class="ink" font-size="18" font-weight="800" text-anchor="middle" >Ballistics engine</text><text x="148.0" y="66.0" class="mut" font-size="13" font-weight="400" text-anchor="middle" >turns positions into stick pushes</text><text x="148.0" y="84.0" class="mut" font-size="13" font-weight="400" text-anchor="middle" >and measures the game by watching it</text></g><path class="g" d="M664,220 H754" stroke-width="3" fill="none" stroke-dasharray="2 7" stroke-linecap="round"/><path class="gf" d="M750,211 L768,220 L750,229 Z"/><g transform="translate(850,220)"><circle class="soft" r="62"/><circle class="b" r="62" fill="none" stroke-width="3"/><circle class="grid" r="42" fill="none" stroke-dasharray="3 5"/><circle class="bf" cx="22" cy="-18" r="24"/></g><text x="850.0" y="306.0" class="ink" font-size="14" font-weight="700" text-anchor="middle" >PS5 thumbstick</text><text x="850.0" y="325.0" class="mut" font-size="12" font-weight="400" text-anchor="middle" >over Remote Play, no hardware</text></svg>