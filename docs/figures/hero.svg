<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-label="A mouse feeds the Nullwire engine, which drives a PS5 thumbstick over Remote Play"><title>A mouse feeds the Nullwire engine, which drives a PS5 thumbstick over Remote Play</title>
<style>
  .panel{fill:#fcfcfb}.ink{fill:#1a1a19}.mut{fill:#6b6a63}.grid{stroke:#e2e1da;stroke-width:1}.axis{stroke:#9b9a92;stroke-width:1}
  .a{stroke:#2a78d6}.b{stroke:#eb6834}.g{stroke:#8a897f}.af{fill:#2a78d6}.bf{fill:#eb6834}.gf{fill:#8a897f}
  .afade{fill:#2a78d6;opacity:.14}.bfade{fill:#eb6834;opacity:.14}.soft{fill:#efeee8}.line{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .panel{fill:#1a1a19}.ink{fill:#f0efec}.mut{fill:#c3c2b7}.grid{stroke:#34332f}.axis{stroke:#6b6a63}
    .a{stroke:#3987e5}.b{stroke:#d95926}.af{fill:#3987e5}.bf{fill:#d95926}.afade{fill:#3987e5}.bfade{fill:#d95926}.soft{fill:#262522}
  }
</style><rect class="panel" width="1000" height="350" rx="14"/><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2a78d6"/><stop offset="1" stop-color="#eb6834"/></linearGradient></defs><rect x="0" y="0" width="1000" height="6" fill="url(#g)" rx="3"/><text x="500.0" y="82.0" class="ink" font-size="54" font-weight="800" text-anchor="middle" >Nullwire</text><text x="500.0" y="118.0" class="mut" font-size="20" font-weight="400" text-anchor="middle" >Teach a thumbstick to move like a mouse.</text><g transform="translate(120,160)"><rect class="soft" x="0" y="0" width="86" height="120" rx="40"/><rect class="a" x="0" y="0" width="86" height="120" rx="40" fill="none" stroke-width="3"/><line class="a" x1="43" y1="0" x2="43" y2="46" stroke-width="3"/><rect class="af" x="39" y="14" width="8" height="20" rx="4"/></g><text x="163.0" y="304.0" class="ink" font-size="14" font-weight="600" text-anchor="middle" >Your mouse</text><text x="163.0" y="322.0" class="mut" font-size="12" font-weight="400" text-anchor="middle" >says where to look</text><path class="g" d="M240,220 H330" stroke-width="3" fill="none" stroke-dasharray="2 7" stroke-linecap="round"/><path class="gf" d="M326,211 L344,220 L326,229 Z"/><g transform="translate(352,170)"><rect class="soft" width="296" height="100" rx="16"/><rect fill="none" class="b" width="296" height="100" rx="16" stroke-width="3"/><text x="148.0" y="42.0" class="ink" font-size="18" font-weight="700" text-anchor="middle" >Ballistics engine</text><text x="148.0" y="66.0" class="mut" font-size="13" font-weight="400" text-anchor="middle" >turns positions into stick pushes</text><text x="148.0" y="84.0" class="mut" font-size="13" font-weight="400" text-anchor="middle" >and measures the game by watching it</text></g><path class="g" d="M664,220 H754" stroke-width="3" fill="none" stroke-dasharray="2 7" stroke-linecap="round"/><path class="gf" d="M750,211 L768,220 L750,229 Z"/><g transform="translate(850,220)"><circle class="soft" r="62"/><circle class="b" r="62" fill="none" stroke-width="3"/><circle class="grid" r="42" fill="none" stroke-dasharray="3 5"/><circle class="bf" cx="22" cy="-18" r="24"/></g><text x="850.0" y="304.0" class="ink" font-size="14" font-weight="600" text-anchor="middle" >PS5 thumbstick</text><text x="850.0" y="322.0" class="mut" font-size="12" font-weight="400" text-anchor="middle" >over Remote Play, no hardware</text></svg>