</style><rect class="panel" width="1000" height="460" rx="14"/><text x="28.0" y="40.0" class="ink" font-size="20" font-weight="700" text-anchor="start" >Stop the push cleanly, or the camera keeps creeping.</text><text x="28.0" y="62.0" class="mut" font-size="13" font-weight="400" text-anchor="start" >A 6° hand movement, then the hand stops. How long does the stick stay pushed?</text><line class="grid" x1="110" x2="940" y1="340.0" y2="340.0"/><text x="100.0" y="344.0" class="mut" font-size="11" font-weight="400" text-anchor="end" >0.0</text><line class="grid" x1="110" x2="940" y1="284.0" y2="284.0"/><text x="100.0" y="288.0" class="mut" font-size="11" font-weight="400" text-anchor="end" >0.1</text><line class="grid" x1="110" x2="940" y1="228.0" y2="228.0"/><text x="100.0" y="232.0" class="mut" font-size="11" font-weight="400" text-anchor="end" >0.2</text><line class="grid" x1="110" x2="940" y1="172.0" y2="172.0"/><text x="100.0" y="176.0" class="mut" font-size="11" font-weight="400" text-anchor="end" >0.3</text><line class="grid" x1="110" x2="940" y1="116.0" y2="116.0"/><text x="100.0" y="120.0" class="mut" font-size="11" font-weight="400" text-anchor="end" >0.4</text><text x="110.0" y="360.0" class="mut" font-size="11" font-weight="400" text-anchor="middle" >0</text><text x="258.2" y="360.0" class="mut" font-size="11" font-weight="400" text-anchor="middle" >50</text><text x="406.4" y="360.0" class="mut" font-size="11" font-weight="400" text-anchor="middle" >100</text><text x="554.6" y="360.0" class="mut" font-size="11" font-weight="400" text-anchor="middle" >150</text><text x="702.9" y="360.0" class="mut" font-size="11" font-weight="400" text-anchor="middle" >200</text><text x="851.1" y="360.0" class="mut" font-size="11" font-weight="400" text-anchor="middle" >250</text><line class="axis" x1="110" x2="940" y1="340" y2="340"/><text x="525.0" y="382.0" class="mut" font-size="12" font-weight="400" text-anchor="middle" >time since the hand started moving (ms)</text><tex