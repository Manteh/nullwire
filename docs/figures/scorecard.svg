<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Headline measured numbers"><title>Headline measured numbers</title>
<style>
  /* GitHub dark: page #0d1117, cards #161b22, borders #30363d. Data colors validated for dark surfaces. */
  .panel{fill:#0d1117;stroke:#21262d;stroke-width:1}.ink{fill:#e6edf3}.mut{fill:#8b949e}
  .grid{stroke:#21262d;stroke-width:1}.axis{stroke:#484f58;stroke-width:1}
  .a{stroke:#388bfd}.b{stroke:#db6d28}.g{stroke:#6e7681}.af{fill:#388bfd}.bf{fill:#db6d28}.gf{fill:#6e7681}
  .afade{fill:#388bfd;opacity:.16}.bfade{fill:#db6d28;opacity:.16}
  .soft{fill:#161b22;stroke:#30363d;stroke-width:1}.line{fill:none;stroke-width:2.75;stroke-linecap:round;stroke-linejoin:round}
  .onacc{fill:#0d1117}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
</style><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#1b2029"/></pattern><linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#388bfd"/><stop offset="1" stop-color="#db6d28"/></linearGradient></defs><rect class="panel" x=".5" y=".5" width="999" height="329" rx="14"/><rect width="1000" height="330" rx="14" fill="url(#dots)"/><rect x="28" y="0" width="64" height="3" rx="1.5" fill="url(#bar)"/><text x="28.0" y="42.0" class="ink" font-size="21" font-weight="800" text-anchor="start" >The numbers so far.</text><text x="28.0" y="64.0" class="mut" font-size="13.5" font-weight="400" text-anchor="start" >All measured on one real PS5. Where it falls short, the README says so.</text><g transform="translate(28,92)"><rect class="soft" width="300" height="98" rx="14"/><rect class="af" x="0" y="0" width="6" height="98" rx="3"/><text x="24.0" y="46.0" class="ink" font-size="30" font-weight="800" text-anchor="start" >0.10</text><text x="24.0" y="68.0" class="ink" font-size="13.5" font-weight="700" text-anchor="start" >deadzone</text><text x="24.0" y="86.0" class="mut" font-size="11.5" font-weight="400" text-anchor="start" >measured, repeatable</text></g><g transform="translate(346,92)"><rect class="soft" width="300" height="98" rx="14"/><rect class="bf" x="0" y="0" width="6" height="98" rx="3"/><text x="24.0" y="46.0" class="ink" font-size="30" font-weight="800" text-anchor="start" >365°/s</text><text x="24.0" y="68.0" class="ink" font-size="13.5" font-weight="700" text-anchor="start" >full-stick turn speed</text><text x="24.0" y="86.0" class="mut" font-size="11.5" font-weight="400" text-anchor="start" >from a real 360° turn</text></g><g transform="translate(664,92)"><rect class="soft" width="300" height="98" rx="14"/><rect class="af" x="0" y="0" width="6" height="98" rx="3"/><text x="24.0" y="46.0" class="ink" font-size="30" font-weight="800" text-anchor="start" >≈ 0.2°</text><text x="24.0" y="68.0" class="ink" font-size="13.5" font-weight="700" text-anchor="start" >tracking error</text><text x="24.0" y="86.0" class="mut" font-size="11.5" font-weight="400" text-anchor="start" >per ¼ second, random paths up to 120°/s</text></g><g transform="translate(28,204)"><rect class="soft" width="300" height="98" rx="14"/><rect class="bf" x="0" y="0" width="6" height="98" rx="3"/><text x="24.0" y="46.0" class="ink" font-size="30" font-weight="800" text-anchor="start" >≤ 0.5°</text><text x="24.0" y="68.0" class="ink" font-size="13.5" font-weight="700" text-anchor="start" >circle closure</text><text x="24.0" y="86.0" class="mut" font-size="11.5" font-weight="400" text-anchor="start" >slow to medium circles</text></g><g transform="translate(346,204)"><rect class="soft" width="300" height="98" rx="14"/><rect class="af" x="0" y="0" width="6" height="98" rx="3"/><text x="24.0" y="46.0" class="ink" font-size="30" font-weight="800" text-anchor="start" >250/s</text><text x="24.0" y="68.0" class="ink" font-size="13.5" font-weight="700" text-anchor="start" >stick updates</text><text x="24.0" y="86.0" class="mut" font-size="11.5" font-weight="400" text-anchor="start" >own high-priority thread</text></g><g transform="translate(664,204)"><rect class="soft" width="300" height="98" rx="14"/><rect class="bf" x="0" y="0" width="6" height="98" rx="3"/><text x="24.0" y="46.0" class="ink" font-size="30" font-weight="800" text-anchor="start" >≈ 80 ms</text><text x="24.0" y="68.0" class="ink" font-size="13.5" font-weight="700" text-anchor="start" >stick → picture</text><text x="24.0" y="86.0" class="mut" font-size="11.5" font-weight="400" text-anchor="start" >on the computer, video included</text></g></svg>