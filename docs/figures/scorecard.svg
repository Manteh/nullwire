<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Headline measured numbers"><title>Headline measured numbers</title>
<style>
  .panel{fill:#fcfcfb}.ink{fill:#1a1a19}.mut{fill:#6b6a63}.grid{stroke:#e2e1da;stroke-width:1}.axis{stroke:#9b9a92;stroke-width:1}
  .a{stroke:#2a78d6}.b{stroke:#eb6834}.g{stroke:#8a897f}.af{fill:#2a78d6}.bf{fill:#eb6834}.gf{fill:#8a897f}
  .afade{fill:#2a78d6;opacity:.14}.bfade{fill:#eb6834;opacity:.14}.soft{fill:#efeee8}.line{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .panel{fill:#1a1a19}.ink{fill:#f0efec}.mut{fill:#c3c2b7}.grid{stroke:#34332f}.axis{stroke:#6b6a63}
    .a{stroke:#3987e5}.b{stroke:#d95926}.af{fill:#3987e5}.bf{fill:#d95926}.afade{fill:#3987e5}.bfade{fill:#d95926}.soft{fill:#262522}
  }
</style><rect class="panel" width="1000" height="330" rx="14"/><text x="28.0" y="40.0" class="ink" font-size="20" font-weight="700" text-anchor="start" >The numbers so far.</text><text x="28.0" y="62.0" class="mut" font-size="13" font-weight="400" text-anchor="start" >All measured on one real PS5. Where it falls short, the README says so.</text><g transform="translate(28,92)"><rect class="soft" width="300" height="98" rx="14"/><rect class="af" x="0" y="0" width="6" height="98" rx="3"/><text x="24.0" y="46.0" class="ink" font-size="30" font-weight="800" text-anchor="start" >0.10</text><text x="24.0" y="68.0" class="ink" font-size="13.5" font-weight="700" text-anchor="start" >deadzone</text><text x="24.0" y="86.0" class="mut" font-size="11.5" font-weight="400" text-anchor="start" >measured, repeatable</text></g><g transform="translate(346,92)"><rect class="soft" width="300" height="98" rx="14"/><rect class="bf" x="0" y="0" width="6" height="98" rx="3"/><text x="24.0" y="46.0" class="ink" font-size="30" font-weight="800" text-anchor="start" >365°/s</text><text x="24.0" y="68.0" class="ink" font-size="13.5" font-weight="700" text-anchor="start" >full-stick turn speed</text><text x="24.0" y="86.0" class="mut" font-size="11.5" font-weight="400" text-anchor="start" >from a real 360° turn</text></g><g transform="translate(664,92)"><rect class="soft" width="300" height="98" rx="14"/><rect class="af" x="0" y="0" width="6" height="98" rx="3"/><text x="24.0" y="46.0" class="ink" font-size="30" font-weight="800" text-anchor="start" >≈ 0.2°</text><text x="24.0" y="68.0" class="ink" font-size="13.5" font-weight="700" text-anchor="start" >tracking error</text><text x="24.0" y="86.0" class="mut" font-size="11.5" font-weight="400" text-anchor="start" >per ¼ second, random paths up to 120°/s</text></g><g transform="translate(28,204)"><rect class="soft" width="300" height="98" rx="14"/><rect class="bf" x="0" y="0" width="6" height="98" rx="3"/><text x="24.0" y="46.0" class="ink" font-size="30" font-weight="800" text-anchor="start" >≤ 0.5°</text><text x="24.0" y="68.0" class="ink" font-size="13.5" font-weight="700" text-anchor="start" >circle closure</text><text x="24.0" y="86.0" class="mut" font-size="11.5" font-weight="400" text-anchor="start" >slow to medium circles</text></g><g transform="translate(346,204)"><rect class="soft" width="300" height="98" rx="14"/><rect class="af" x="0" y="0" width="6" height="98" rx="3"/><text x="24.0" y="46.0" class="ink" font-size="30" font-weight="800" text-anchor="start" >250/s</text><text x="24.0" y="68.0" class="ink" font-size="13.5" font-weight="700" text-anchor="start" >stick updates</text><text x="24.0" y="86.0" class="mut" font-size="11.5" font-weight="400" text-anchor="start" >own high-priority thread</text></g><g transform="translate(664,204)"><rect class="soft" width="300" height="98" rx="14"/><rect class="bf" x="0" y="0" width="6" height="98" rx="3"/><text x="24.0" y="46.0" class="ink" font-size="30" font-weight="800" text-anchor="start" >≈ 80 ms</text><text x="24.0" y="68.0" class="ink" font-size="13.5" font-weight="700" text-anchor="start" >stick → picture</text><text x="24.0" y="86.0" class="mut" font-size="11.5" font-weight="400" text-anchor="start" >on the computer, video included</text></g></svg>