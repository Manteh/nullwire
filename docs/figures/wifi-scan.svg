<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="A Wi-Fi scan raises aiming error from about one degree to about twenty degrees"><title>A Wi-Fi scan raises aiming error from about one degree to about twenty degrees</title>
<style>
  .panel{fill:#fcfcfb}.ink{fill:#1a1a19}.mut{fill:#6b6a63}.grid{stroke:#e2e1da;stroke-width:1}.axis{stroke:#9b9a92;stroke-width:1}
  .a{stroke:#2a78d6}.b{stroke:#eb6834}.g{stroke:#8a897f}.af{fill:#2a78d6}.bf{fill:#eb6834}.gf{fill:#8a897f}
  .afade{fill:#2a78d6;opacity:.14}.bfade{fill:#eb6834;opacity:.14}.soft{fill:#efeee8}.line{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .panel{fill:#1a1a19}.ink{fill:#f0efec}.mut{fill:#c3c2b7}.grid{stroke:#34332f}.axis{stroke:#6b6a63}
    .a{stroke:#3987e5}.b{stroke:#d95926}.af{fill:#3987e5}.bf{fill:#d95926}.afade{fill:#3987e5}.bfade{fill:#d95926}.soft{fill:#262522}
  }
</style><rect class="panel" width="1000" height="420" rx="14"/><text x="28.0" y="40.0" class="ink" font-size="20" font-weight="700" text-anchor="start" >The one thing that hurts: Wi-Fi hiccups.</text><text x="28.0" y="62.0" class="mut" font-size="13" font-weight="400" text-anchor="start" >Aiming error with the network quiet, and while the Mac scanned for Wi-Fi. 12 runs each.</text><line class="grid" x1="110" x2="500" y1="320.0" y2="320.0"/><text x="100.0" y="324.0" class="mut" font-size="11" font-weight="400" text-anchor="end" >0°</text><line class="grid" x1="110" x2="500" y1="267.5" y2="267.5"/><text x="100.0" y="271.5" class="mut" font-size="11" font-weight="400" text-anchor="end" >6°</text><line class="grid" x1="110" x2="500" y1="215.0" y2="215.0"/><text x="100.0" y="219.0" class="mut" font-size="11" font-weight="400" text-anchor="end" >12°</text><line class="grid" x1="110" x2="500" y1="162.5" y2="162.5"/><text x="100.0" y="166.5" class="mut" font-size="11" font-weight="400" text-anchor="end" >18°</text><line class="grid" x1="110" x2="500" y1="110.0" y2="110.0"/><text x="100.0" y="114.0" class="mut" font-size="11" font-weight="400" text-anchor="end" >24°</text><line class="axis" x1="110" x2="500" y1="320" y2="320"/><text x="305.0" y="362.0" class="mut" font-size="12" font-weight="400" text-anchor="middle" ></text><text x="66.0" y="215.0" class="mut" font-size="12" font-weight="400" text-anchor="middle" transform="rotate(-90 66 215.0)">degrees off at the end</text><rect class="af" x="152.5" y="309.7" width="110" height="10.3" rx="6"/><text x="207.5" y="299.7" class="ink" font-size="16" font-weight="700" text-anchor="middle" >1.2°</text><text x="207.5" y="342.0" class="mut" font-size="12.5" font-weight="400" text-anchor="middle" >quiet network</text><rect class="bf" x="347.5" y="139.3" width="110" height="180.7" rx="6"/><text x="402.5" y="129.3" class="ink" font-size="16" font-weight="700" text-anchor="middle" >20.6°</text><text x="402.5" y="342.0" class="mut" font-size="12.5" font-weight="400" text-anchor="middle" >during a Wi-Fi scan</text><g transform="translate(580,110)"><rect class="soft" width="360" height="232" rx="14"/><text x="22.0" y="36.0" class="ink" font-size="15" font-weight="700" text-anchor="start" >Why a late packet matters</text><text x="22.0" y="64.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >A stick sets a camera SPEED.</text><text x="22.0" y="83.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >If an update arrives late, the camera</text><text x="22.0" y="102.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >keeps turning at the old speed until it</text><text x="22.0" y="121.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >finally shows up.</text><text x="22.0" y="140.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" ></text><text x="22.0" y="159.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >Faster resends and priority tags didn&#x27;t</text><text x="22.0" y="178.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >help: the packets are late, not lost.</text><text x="22.0" y="197.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >Wired Ethernet is the planned fix.</text></g><text x="500.0" y="392.0" class="mut" font-size="11.5" font-weight="400" text-anchor="middle" >Measured: pings jumped from a median of 3.6 ms to about 20 ms (worst around 190 ms) while a scan ran.</text></svg>