<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="The six stages of automatic calibration"><title>The six stages of automatic calibration</title>
<style>
  /* GitHub dark: page #0d1117, cards #161b22, borders #30363d. Data colors validated for dark surfaces. */
  .panel{fill:#0d1117;stroke:#21262d;stroke-width:1}.ink{fill:#e6edf3}.mut{fill:#8b949e}
  .grid{stroke:#21262d;stroke-width:1}.axis{stroke:#484f58;stroke-width:1}
  .a{stroke:#388bfd}.b{stroke:#db6d28}.g{stroke:#6e7681}.af{fill:#388bfd}.bf{fill:#db6d28}.gf{fill:#6e7681}
  .afade{fill:#388bfd;opacity:.16}.bfade{fill:#db6d28;opacity:.16}
  .soft{fill:#161b22;stroke:#30363d;stroke-width:1}.line{fill:none;stroke-width:2.75;stroke-linecap:round;stroke-linejoin:round}
  .onacc{fill:#0d1117}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
</style><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#1b2029"/></pattern><linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#388bfd"/><stop offset="1" stop-color="#db6d28"/></linearGradient></defs><rect class="panel" x=".5" y=".5" width="999" height="419" rx="14"/><rect width="1000" height="420" rx="14" fill="url(#dots)"/><rect x="28" y="0" width="64" height="3" rx="1.5" fill="url(#bar)"/><text x="28.0" y="42.0" class="ink" font-size="21" font-weight="800" text-anchor="start" >The game gets measured by watching it.</text><text x="28.0" y="64.0" class="mut" font-size="13.5" font-weight="400" text-anchor="start" >Press one key. About 30 seconds later it knows the deadzone, curve, turn speed and delay.</text><g transform="translate(28,100)"><rect class="soft" width="148" height="240" rx="14"/><circle class="af" cx="30" cy="34" r="16"/><text x="30.0" y="40.0" class="onacc" font-size="14" font-weight="800" text-anchor="middle" >1</text><text x="18.0" y="82.0" class="ink" font-size="15" font-weight="700" text-anchor="start" >Settle</text><text x="18.0" y="108.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >Hold still. Measure</text><text x="18.0" y="126.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >how much the</text><text x="18.0" y="144.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >picture wobbles on</text><text x="18.0" y="162.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >its own.</text><text x="18.0" y="224.0" class="ink" font-size="12" font-weight="700" text-anchor="start" >≈ 1 s</text></g><path class="gf" d="M178,220 l8,5 l-8,5 z"/><g transform="translate(188,100)"><rect class="soft" width="148" height="240" rx="14"/><circle class="bf" cx="30" cy="34" r="16"/><text x="30.0" y="40.0" class="onacc" font-size="14" font-weight="800" text-anchor="middle" >2</text><text x="18.0" y="82.0" class="ink" font-size="15" font-weight="700" text-anchor="start" >Latency</text><text x="18.0" y="108.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >Tap the stick. Time</text><text x="18.0" y="126.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >how long until the</text><text x="18.0" y="144.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >picture moves.</text><text x="18.0" y="224.0" class="ink" font-size="12" font-weight="700" text-anchor="start" >≈ 5 s</text></g><path class="gf" d="M338,220 l8,5 l-8,5 z"/><g transform="translate(348,100)"><rect class="soft" width="148" height="240" rx="14"/><circle class="af" cx="30" cy="34" r="16"/><text x="30.0" y="40.0" class="onacc" font-size="14" font-weight="800" text-anchor="middle" >3</text><text x="18.0" y="82.0" class="ink" font-size="15" font-weight="700" text-anchor="start" >Deadzone</text><text x="18.0" y="108.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >Raise the push 1%</text><text x="18.0" y="126.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >at a time until the</text><text x="18.0" y="144.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >camera starts to</text><text x="18.0" y="162.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >move.</text><text x="18.0" y="224.0" class="ink" font-size="12" font-weight="700" text-anchor="start" >≈ 5 to 20 s</text></g><path class="gf" d="M498,220 l8,5 l-8,5 z"/><g transform="translate(508,100)"><rect class="soft" width="148" height="240" rx="14"/><circle class="bf" cx="30" cy="34" r="16"/><text x="30.0" y="40.0" class="onacc" font-size="14" font-weight="800" text-anchor="middle" >4</text><text x="18.0" y="82.0" class="ink" font-size="15" font-weight="700" text-anchor="start" >Response curve</text><text x="18.0" y="108.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >Hold 12 different</text><text x="18.0" y="126.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >pushes and measure</text><text x="18.0" y="144.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >the speed of each.</text><text x="18.0" y="224.0" class="ink" font-size="12" font-weight="700" text-anchor="start" >≈ 15 s</text></g><path class="gf" d="M658,220 l8,5 l-8,5 z"/><g transform="translate(668,100)"><rect class="soft" width="148" height="240" rx="14"/><circle class="af" cx="30" cy="34" r="16"/><text x="30.0" y="40.0" class="onacc" font-size="14" font-weight="800" text-anchor="middle" >5</text><text x="18.0" y="82.0" class="ink" font-size="15" font-weight="700" text-anchor="start" >Ramp check</text><text x="18.0" y="108.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >Does the speed keep</text><text x="18.0" y="126.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >building while</text><text x="18.0" y="144.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >held? (ease-in /</text><text x="18.0" y="162.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >smoothing)</text><text x="18.0" y="224.0" class="ink" font-size="12" font-weight="700" text-anchor="start" >≈ 2 s</text></g><path class="gf" d="M818,220 l8,5 l-8,5 z"/><g transform="translate(828,100)"><rect class="soft" width="148" height="240" rx="14"/><circle class="bf" cx="30" cy="34" r="16"/><text x="30.0" y="40.0" class="onacc" font-size="14" font-weight="800" text-anchor="middle" >6</text><text x="18.0" y="82.0" class="ink" font-size="15" font-weight="700" text-anchor="start" >Full turn</text><text x="18.0" y="108.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >Hold full push</text><text x="18.0" y="126.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >until the view</text><text x="18.0" y="144.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >repeats: that&#x27;s</text><text x="18.0" y="162.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >360° and the real</text><text x="18.0" y="180.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >°/s.</text><text x="18.0" y="224.0" class="ink" font-size="12" font-weight="700" text-anchor="start" >≈ 1 s</text></g><text x="500.0" y="386.0" class="mut" font-size="12.5" font-weight="400" text-anchor="middle" >Everything runs on the game&#x27;s own video. If something is wrong (a blank wall, smoothing on), it stops and says why.</text></svg>