<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="The six stages of automatic calibration"><title>The six stages of automatic calibration</title>
<style>
  .panel{fill:#fcfcfb}.ink{fill:#1a1a19}.mut{fill:#6b6a63}.grid{stroke:#e2e1da;stroke-width:1}.axis{stroke:#9b9a92;stroke-width:1}
  .a{stroke:#2a78d6}.b{stroke:#eb6834}.g{stroke:#8a897f}.af{fill:#2a78d6}.bf{fill:#eb6834}.gf{fill:#8a897f}
  .afade{fill:#2a78d6;opacity:.14}.bfade{fill:#eb6834;opacity:.14}.soft{fill:#efeee8}.line{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .panel{fill:#1a1a19}.ink{fill:#f0efec}.mut{fill:#c3c2b7}.grid{stroke:#34332f}.axis{stroke:#6b6a63}
    .a{stroke:#3987e5}.b{stroke:#d95926}.af{fill:#3987e5}.bf{fill:#d95926}.afade{fill:#3987e5}.bfade{fill:#d95926}.soft{fill:#262522}
  }
</style><rect class="panel" width="1000" height="420" rx="14"/><text x="28.0" y="40.0" class="ink" font-size="20" font-weight="700" text-anchor="start" >The game gets measured by watching it.</text><text x="28.0" y="62.0" class="mut" font-size="13" font-weight="400" text-anchor="start" >Press one key. About 30 seconds later it knows the deadzone, curve, turn speed and delay.</text><g transform="translate(28,100)"><rect class="soft" width="148" height="240" rx="14"/><circle class="af" cx="30" cy="34" r="16"/><text x="30.0" y="40.0" class="ink" font-size="14" font-weight="800" text-anchor="middle" fill="#fff" style="fill:#fff">1</text><text x="18.0" y="82.0" class="ink" font-size="15" font-weight="700" text-anchor="start" >Settle</text><text x="18.0" y="108.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >Hold still. Measure</text><text x="18.0" y="126.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >how much the</text><text x="18.0" y="144.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >picture wobbles on</text><text x="18.0" y="162.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >its own.</text><text x="18.0" y="224.0" class="ink" font-size="12" font-weight="700" text-anchor="start" >≈ 1 s</text></g><path class="gf" d="M178,220 l8,5 l-8,5 z"/><g transform="translate(188,100)"><rect class="soft" width="148" height="240" rx="14"/><circle class="bf" cx="30" cy="34" r="16"/><text x="30.0" y="40.0" class="ink" font-size="14" font-weight="800" text-anchor="middle" fill="#fff" style="fill:#fff">2</text><text x="18.0" y="82.0" class="ink" font-size="15" font-weight="700" text-anchor="start" >Latency</text><text x="18.0" y="108.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >Tap the stick. Time</text><text x="18.0" y="126.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >how long until the</text><text x="18.0" y="144.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >picture moves.</text><text x="18.0" y="224.0" class="ink" font-size="12" font-weight="700" text-anchor="start" >≈ 5 s</text></g><path class="gf" d="M338,220 l8,5 l-8,5 z"/><g transform="translate(348,100)"><rect class="soft" width="148" height="240" rx="14"/><circle class="af" cx="30" cy="34" r="16"/><text x="30.0" y="40.0" class="ink" font-size="14" font-weight="800" text-anchor="middle" fill="#fff" style="fill:#fff">3</text><text x="18.0" y="82.0" class="ink" font-size="15" font-weight="700" text-anchor="start" >Deadzone</text><text x="18.0" y="108.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >Raise the push 1%</text><text x="18.0" y="126.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >at a time until the</text><text x="18.0" y="144.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >camera starts to</text><text x="18.0" y="162.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >move.</text><text x="18.0" y="224.0" class="ink" font-size="12" font-weight="700" text-anchor="start" >≈ 5 to 20 s</text></g><path class="gf" d="M498,220 l8,5 l-8,5 z"/><g transform="translate(508,100)"><rect class="soft" width="148" height="240" rx="14"/><circle class="bf" cx="30" cy="34" r="16"/><text x="30.0" y="40.0" class="ink" font-size="14" font-weight="800" text-anchor="middle" fill="#fff" style="fill:#fff">4</text><text x="18.0" y="82.0" class="ink" font-size="15" font-weight="700" text-anchor="start" >Response curve</text><text x="18.0" y="108.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >Hold 12 different</text><text x="18.0" y="126.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >pushes and measure</text><text x="18.0" y="144.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >the speed of each.</text><text x="18.0" y="224.0" class="ink" font-size="12" font-weight="700" text-anchor="start" >≈ 15 s</text></g><path class="gf" d="M658,220 l8,5 l-8,5 z"/><g transform="translate(668,100)"><rect class="soft" width="148" height="240" rx="14"/><circle class="af" cx="30" cy="34" r="16"/><text x="30.0" y="40.0" class="ink" font-size="14" font-weight="800" text-anchor="middle" fill="#fff" style="fill:#fff">5</text><text x="18.0" y="82.0" class="ink" font-size="15" font-weight="700" text-anchor="start" >Ramp check</text><text x="18.0" y="108.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >Does the speed keep</text><text x="18.0" y="126.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >building while</text><text x="18.0" y="144.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >held? (ease-in /</text><text x="18.0" y="162.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >smoothing)</text><text x="18.0" y="224.0" class="ink" font-size="12" font-weight="700" text-anchor="start" >≈ 2 s</text></g><path class="gf" d="M818,220 l8,5 l-8,5 z"/><g transform="translate(828,100)"><rect class="soft" width="148" height="240" rx="14"/><circle class="bf" cx="30" cy="34" r="16"/><text x="30.0" y="40.0" class="ink" font-size="14" font-weight="800" text-anchor="middle" fill="#fff" style="fill:#fff">6</text><text x="18.0" y="82.0" class="ink" font-size="15" font-weight="700" text-anchor="start" >Full turn</text><text x="18.0" y="108.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >Hold full push</text><text x="18.0" y="126.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >until the view</text><text x="18.0" y="144.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >repeats: that&#x27;s</text><text x="18.0" y="162.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >360° and the real</text><text x="18.0" y="180.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >°/s.</text><text x="18.0" y="224.0" class="ink" font-size="12" font-weight="700" text-anchor="start" >≈ 1 s</text></g><text x="500.0" y="386.0" class="mut" font-size="12.5" font-weight="400" text-anchor="middle" >Everything runs on the game&#x27;s own video. If something is wrong (a blank wall, smoothing on), it stops and says why.</text></svg>