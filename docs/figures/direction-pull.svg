<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" role="img" aria-label="At hard pushes the game bends the camera direction by several degrees, gentle pushes barely bend it"><title>At hard pushes the game bends the camera direction by several degrees, gentle pushes barely bend it</title>
<style>
  .panel{fill:#fcfcfb}.ink{fill:#1a1a19}.mut{fill:#6b6a63}.grid{stroke:#e2e1da;stroke-width:1}.axis{stroke:#9b9a92;stroke-width:1}
  .a{stroke:#2a78d6}.b{stroke:#eb6834}.g{stroke:#8a897f}.af{fill:#2a78d6}.bf{fill:#eb6834}.gf{fill:#8a897f}
  .afade{fill:#2a78d6;opacity:.14}.bfade{fill:#eb6834;opacity:.14}.soft{fill:#efeee8}.line{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .panel{fill:#1a1a19}.ink{fill:#f0efec}.mut{fill:#c3c2b7}.grid{stroke:#34332f}.axis{stroke:#6b6a63}
    .a{stroke:#3987e5}.b{stroke:#d95926}.af{fill:#3987e5}.bf{fill:#d95926}.afade{fill:#3987e5}.bfade{fill:#d95926}.soft{fill:#262522}
  }
</style><rect class="panel" width="1000" height="490" rx="14"/><text x="28.0" y="40.0" class="ink" font-size="20" font-weight="700" text-anchor="start" >The game quietly bends your direction.</text><text x="28.0" y="62.0" class="mut" font-size="13" font-weight="400" text-anchor="start" >How far the camera&#x27;s direction was from the stick&#x27;s, at three push strengths. Zero is perfect.</text><line class="grid" x1="110" x2="940" y1="360.0" y2="360.0"/><text x="100.0" y="364.0" class="mut" font-size="11" font-weight="400" text-anchor="end" >-12°</text><line class="grid" x1="110" x2="940" y1="322.5" y2="322.5"/><text x="100.0" y="326.5" class="mut" font-size="11" font-weight="400" text-anchor="end" >-8°</text><line class="grid" x1="110" x2="940" y1="284.9" y2="284.9"/><text x="100.0" y="288.9" class="mut" font-size="11" font-weight="400" text-anchor="end" >-4°</text><line class="grid" x1="110" x2="940" y1="247.4" y2="247.4"/><text x="100.0" y="251.4" class="mut" font-size="11" font-weight="400" text-anchor="end" >0°</text><line class="grid" x1="110" x2="940" y1="209.8" y2="209.8"/><text x="100.0" y="213.8" class="mut" font-size="11" font-weight="400" text-anchor="end" >+4°</text><line class="grid" x1="110" x2="940" y1="172.3" y2="172.3"/><text x="100.0" y="176.3" class="mut" font-size="11" font-weight="400" text-anchor="end" >+8°</text><line class="grid" x1="110" x2="940" y1="134.8" y2="134.8"/><text x="100.0" y="138.8" class="mut" font-size="11" font-weight="400" text-anchor="end" >+12°</text><text x="110.0" y="380.0" class="mut" font-size="11" font-weight="400" text-anchor="middle" >0°</text><text x="248.3" y="380.0" class="mut" font-size="11" font-weight="400" text-anchor="middle" >15°</text><text x="386.7" y="380.0" class="mut" font-size="11" font-weight="400" text-anchor="middle" >30°</text><text x="525.0" y="380.0" class="mut" font-size="11" font-weight="400" text-anchor="middle" >45°</text><text x="663.3" y="380.0" class="mut" font-size="11" font-weight="400" text-anchor="middle" >60°</text><text x="801.7" y="380.0" class="mut" font-size="11" font-weight="400" text-anchor="middle" >75°</text><text x="940.0" y="380.0" class="mut" font-size="11" font-weight="400" text-anchor="middle" >90°</text><line class="axis" x1="110" x2="940" y1="360" y2="360"/><text x="525.0" y="402.0" class="mut" font-size="12" font-weight="400" text-anchor="middle" >direction you pushed the stick (degrees from straight right)</text><text x="66.0" y="238.0" class="mut" font-size="12" font-weight="400" text-anchor="middle" transform="rotate(-90 66 238.0)">camera direction minus stick direction</text><line class="axis" x1="110" x2="940" y1="247.4" y2="247.4"/><path class="line a" d="M110.0,239.9 L248.3,272.7 L386.7,262.4 L525.0,242.7 L663.3,220.2 L801.7,214.5 L940.0,251.1"/><circle class="af" cx="110.0" cy="239.9" r="4.5"/><circle class="af" cx="248.3" cy="272.7" r="4.5"/><circle class="af" cx="386.7" cy="262.4" r="4.5"/><circle class="af" cx="525.0" cy="242.7" r="4.5"/><circle class="af" cx="663.3" cy="220.2" r="4.5"/><circle class="af" cx="801.7" cy="214.5" r="4.5"/><circle class="af" cx="940.0" cy="251.1" r="4.5"/><path class="line b" d="M110.0,239.9 L248.3,330.9 L386.7,321.5 L525.0,217.4 L663.3,141.3 L801.7,152.6 L940.0,248.3"/><circle class="bf" cx="110.0" cy="239.9" r="4.5"/><circle class="bf" cx="248.3" cy="330.9" r="4.5"/><circle class="bf" cx="386.7" cy="321.5" r="4.5"/><circle class="bf" cx="525.0" cy="217.4" r="4.5"/><circle class="bf" cx="663.3" cy="141.3" r="4.5"/><circle class="bf" cx="801.7" cy="152.6" r="4.5"/><circle class="bf" cx="940.0" cy="248.3" r="4.5"/><text x="515.8" y="294.3" class="ink" font-size="12.5" font-weight="700" text-anchor="start" >Hard pushes are pulled toward straight left/right</text><text x="515.8" y="311.3" class="mut" font-size="12" font-weight="400" text-anchor="start" >(about 9° at 15° and 30°) and toward straight up/down</text><text x="515.8" y="327.3" class="mut" font-size="12" font-weight="400" text-anchor="start" >(about 10° at 60° and 75°). That squares off circles.</text><text x="128.4" y="139.5" class="ink" font-size="12.5" font-weight="700" text-anchor="start" >Gentle pushes barely bend:</text><text x="128.4" y="156.5" class="mut" font-size="12" font-weight="400" text-anchor="start" >within about 3.5°</text><circle class="af" cx="183.8" cy="422" r="5"/><text x="195.8" y="426.0" class="ink" font-size="12" font-weight="400" text-anchor="start" >gentle push (0.3)</text><circle class="bf" cx="423.6" cy="422" r="5"/><text x="435.6" y="426.0" class="ink" font-size="12" font-weight="400" text-anchor="start" >hard push (0.9)</text><text x="500.0" y="452.0" class="mut" font-size="11.5" font-weight="400" text-anchor="middle" >Nullwire aims a few degrees the other way, so the camera lands in the direction your hand actually moved.</text></svg>