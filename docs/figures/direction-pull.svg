<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" role="img" aria-label="At hard pushes the game bends the camera direction by several degrees, gentle pushes barely bend it"><title>At hard pushes the game bends the camera direction by several degrees, gentle pushes barely bend it</title>
<style>
  /* GitHub dark: page #0d1117, cards #161b22, borders #30363d. Data colors validated for dark surfaces. */
  .panel{fill:#0d1117;stroke:#21262d;stroke-width:1}.ink{fill:#e6edf3}.mut{fill:#8b949e}
  .grid{stroke:#21262d;stroke-width:1}.axis{stroke:#484f58;stroke-width:1}
  .a{stroke:#388bfd}.b{stroke:#db6d28}.g{stroke:#6e7681}.af{fill:#388bfd}.bf{fill:#db6d28}.gf{fill:#6e7681}
  .afade{fill:#388bfd;opacity:.16}.bfade{fill:#db6d28;opacity:.16}
  .soft{fill:#161b22;stroke:#30363d;stroke-width:1}.line{fill:none;stroke-width:2.75;stroke-linecap:round;stroke-linejoin:round}
  .onacc{fill:#0d1117}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
</style><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#1b2029"/></pattern><linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#388bfd"/><stop offset="1" stop-color="#db6d28"/></linearGradient></defs><rect class="panel" x=".5" y=".5" width="999" height="489" rx="14"/><rect width="1000" height="490" rx="14" fill="url(#dots)"/><rect x="28" y="0" width="64" height="3" rx="1.5" fill="url(#bar)"/><text x="28.0" y="42.0" class="ink" font-size="21" font-weight="800" text-anchor="start" >The game quietly bends your direction.</text><text x="28.0" y="64.0" class="mut" font-size="13.5" font-weight="400" text-anchor="start" >How far the camera&#x27;s direction was from the stick&#x27;s, at three push strengths. Zero is perfect.</text><line class="grid" x1="110" x2="940" y1="360.0" y2="360.0"/><text x="100.0" y="364.0" class="mut" font-size="11" font-weight="400" text-anchor="end" >-12°</text><line class="grid" x1="110" x2="940" y1="322.5" y2="322.5"/><text x="100.0" y="326.5" class="mut" font-size="11" font-weight="400" text-anchor="end" >-8°</text><line class="grid" x1="110" x2="940" y1="284.9" y2="284.9"/><text x="100.0" y="288.9" class="mut" font-size="11" font-weight="400" text-anchor="end" >-4°</text><line class="grid" x1="110" x2="940" y1="247.4" y2="247.4"/><text x="100.0" y="251.4" class="mut" font-size="11" font-weight="400" text-anchor="end" >0°</text><line class="grid" x1="110" x2="940" y1="209.8" y2="209.8"/><text x="100.0" y="213.8" class="mut" font-size="11" font-weight="400" text-anchor="end" >+4°</text><line class="grid" x1="110" x2="940" y1="172.3" y2="172.3"/><text x="100.0" y="176.3" class="mut" font-size="11" font-weight="400" text-anchor="end" >+8°</text><line class="grid" x1="110" x2="940" y1="134.8" y2="134.8"/><text x="100.0" y="138.8" class="mut" font-size="11" font-weight="400" text-anchor="end" >+12°</text><text x="110.0" y="380.0" class="mut" font-size="11" font-weight="400" text-anchor="middle" >0°</text><text x="248.3" y="380.0" class="mut" font-size="11" font-weight="400" text-anchor="middle" >15°</text><text x="386.7" y="380.0" class="mut" font-size="11" font-weight="400" text-anchor="middle" >30°</text><text x="525.0" y="380.0" class="mut" font-size="11" font-weight="400" text-anchor="middle" >45°</text><text x="663.3" y="380.0" class="mut" font-size="11" font-weight="400" text-anchor="middle" >60°</text><text x="801.7" y="380.0" class="mut" font-size="11" font-weight="400" text-anchor="middle" >75°</text><text x="940.0" y="380.0" class="mut" font-size="11" font-weight="400" text-anchor="middle" >90°</text><line class="axis" x1="110" x2="940" y1="360" y2="360"/><text x="525.0" y="402.0" class="mut" font-size="12" font-weight="400" text-anchor="middle" >direction you pushed the stick (degrees from straight right)</text><text x="66.0" y="238.0" class="mut" font-size="12" font-weight="400" text-anchor="middle" transform="rotate(-90 66 238.0)">camera direction minus stick direction</text><line class="axis" x1="110" x2="940" y1="247.4" y2="247.4"/><path class="line a" d="M110.0,239.9 L248.3,272.7 L386.7,262.4 L525.0,242.7 L663.3,220.2 L801.7,214.5 L940.0,251.1"/><circle class="af" cx="110.0" cy="239.9" r="4.5"/><circle class="af" cx="248.3" cy="272.7" r="4.5"/><circle class="af" cx="386.7" cy="262.4" r="4.5"/><circle class="af" cx="525.0" cy="242.7" r="4.5"/><circle class="af" cx="663.3" cy="220.2" r="4.5"/><circle class="af" cx="801.7" cy="214.5" r="4.5"/><circle class="af" cx="940.0" cy="251.1" r="4.5"/><path class="line b" d="M110.0,239.9 L248.3,330.9 L386.7,321.5 L525.0,217.4 L663.3,141.3 L801.7,152.6 L940.0,248.3"/><circle class="bf" cx="110.0" cy="239.9" r="4.5"/><circle class="bf" cx="248.3" cy="330.9" r="4.5"/><circle class="bf" cx="386.7" cy="321.5" r="4.5"/><circle class="bf" cx="525.0" cy="217.4" r="4.5"/><circle class="bf" cx="663.3" cy="141.3" r="4.5"/><circle class="bf" cx="801.7" cy="152.6" r="4.5"/><circle class="bf" cx="940.0" cy="248.3" r="4.5"/><text x="515.8" y="294.3" class="ink" font-size="12.5" font-weight="700" text-anchor="start" >Hard pushes are pulled toward straight left/right</text><text x="515.8" y="311.3" class="mut" font-size="12" font-weight="400" text-anchor="start" >(about 9° at 15° and 30°) and toward straight up/down</text><text x="515.8" y="327.3" class="mut" font-size="12" font-weight="400" text-anchor="start" >(about 10° at 60° and 75°). That squares off circles.</text><text x="128.4" y="139.5" class="ink" font-size="12.5" font-weight="700" text-anchor="start" >Gentle pushes barely bend:</text><text x="128.4" y="156.5" class="mut" font-size="12" font-weight="400" text-anchor="start" >within about 3.5°</text><circle class="af" cx="183.8" cy="422" r="5"/><text x="195.8" y="426.0" class="ink" font-size="12" font-weight="400" text-anchor="start" >gentle push (0.3)</text><circle class="bf" cx="423.6" cy="422" r="5"/><text x="435.6" y="426.0" class="ink" font-size="12" font-weight="400" text-anchor="start" >hard push (0.9)</text><text x="500.0" y="452.0" class="mut" font-size="11.5" font-weight="400" text-anchor="middle" >Nullwire aims a few degrees the other way, so the camera lands in the direction your hand actually moved.</text></svg>