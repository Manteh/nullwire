<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Measured camera speed against stick push follows a straight line past the deadzone"><title>Measured camera speed against stick push follows a straight line past the deadzone</title>
<style>
  .panel{fill:#fcfcfb}.ink{fill:#1a1a19}.mut{fill:#6b6a63}.grid{stroke:#e2e1da;stroke-width:1}.axis{stroke:#9b9a92;stroke-width:1}
  .a{stroke:#2a78d6}.b{stroke:#eb6834}.g{stroke:#8a897f}.af{fill:#2a78d6}.bf{fill:#eb6834}.gf{fill:#8a897f}
  .afade{fill:#2a78d6;opacity:.14}.bfade{fill:#eb6834;opacity:.14}.soft{fill:#efeee8}.line{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .panel{fill:#1a1a19}.ink{fill:#f0efec}.mut{fill:#c3c2b7}.grid{stroke:#34332f}.axis{stroke:#6b6a63}
    .a{stroke:#3987e5}.b{stroke:#d95926}.af{fill:#3987e5}.bf{fill:#d95926}.afade{fill:#3987e5}.bfade{fill:#d95926}.soft{fill:#262522}
  }
</style><rect class="panel" width="1000" height="470" rx="14"/><text x="28.0" y="40.0" class="ink" font-size="20" font-weight="700" text-anchor="start" >What the game does with the stick.</text><text x="28.0" y="62.0" class="mut" font-size="13" font-weight="400" text-anchor="start" >Measured on a real PS5: how far the stick is pushed, and how fast the camera turns.</text><line class="grid" x1="110" x2="940" y1="350.0" y2="350.0"/><text x="100.0" y="354.0" class="mut" font-size="11" font-weight="400" text-anchor="end" >0%</text><line class="grid" x1="110" x2="940" y1="291.5" y2="291.5"/><text x="100.0" y="295.5" class="mut" font-size="11" font-weight="400" text-anchor="end" >25%</text><line class="grid" x1="110" x2="940" y1="233.0" y2="233.0"/><text x="100.0" y="237.0" class="mut" font-size="11" font-weight="400" text-anchor="end" >50%</text><line class="grid" x1="110" x2="940" y1="174.5" y2="174.5"/><text x="100.0" y="178.5" class="mut" font-size="11" font-weight="400" text-anchor="end" >75%</text><line class="grid" x1="110" x2="940" y1="116.0" y2="116.0"/><text x="100.0" y="120.0" class="mut" font-size="11" font-weight="400" text-anchor="end" >100%</text><text x="110.0" y="370.0" class="mut" font-size="11" font-weight="400" text-anchor="middle" >0</text><text x="276.0" y="370.0" class="mut" font-size="11" font-weight="400" text-anchor="middle" >0.2</text><text x="442.0" y="370.0" class="mut" font-size="11" font-weight="400" text-anchor="middle" >0.4</text><text x="608.0" y="370.0" class="mut" font-size="11" font-weight="400" text-anchor="middle" >0.6</text><text x="774.0" y="370.0" class="mut" font-size="11" font-weight="400" text-anchor="middle" >0.8</text><text x="940.0" y="370.0" class="mut" font-size="11" font-weight="400" text-anchor="middle" >1</text><line class="axis" x1="110" x2="940" y1="350" y2="350"/><text x="525.0" y="392.0" class="mut" font-size="12" font-weight="400" text-anchor="middle" >stick push (0 = centered, 1 = all the way)</text><text x="66.0" y="233.0" class="mut" font-size="12" font-weight="400" text-anchor="middle" transform="rotate(-90 66 233.0)">camera speed (% of the maximum)</text><rect class="soft" x="110.0" y="116" width="85.5" height="234" opacity=".8"/><text x="152.7" y="134.0" class="mut" font-size="11" font-weight="400" text-anchor="middle" >deadzone</text><text x="152.7" y="149.0" class="mut" font-size="11" font-weight="400" text-anchor="middle" >≈0.10</text><path class="line g" d="M193.0,350.0 L940.0,116.0" stroke-dasharray="6 5"/><path class="line a" d="M383.1,290.1 L494.3,256.6 L605.5,220.8 L716.7,171.7 L791.4,162.6 L851.2,142.0 L880.2,135.7 L910.1,124.4 L940.0,116.0"/><circle class="af" cx="383.1" cy="290.1" r="4.5"/><circle class="af" cx="494.3" cy="256.6" r="4.5"/><circle class="af" cx="605.5" cy="220.8" r="4.5"/><circle class="af" cx="716.7" cy="171.7" r="4.5"/><circle class="af" cx="791.4" cy="162.6" r="4.5"/><circle class="af" cx="851.2" cy="142.0" r="4.5"/><circle class="af" cx="880.2" cy="135.7" r="4.5"/><circle class="af" cx="910.1" cy="124.4" r="4.5"/><circle class="af" cx="940.0" cy="116.0" r="4.5"/><text x="259.4" y="228.3" class="mut" font-size="12" font-weight="400" text-anchor="start" >a straight line</text><text x="259.4" y="244.3" class="mut" font-size="12" font-weight="400" text-anchor="start" >(dashed) is almost exactly</text><text x="259.4" y="260.3" class="mut" font-size="12" font-weight="400" text-anchor="start" >what the game does</text><text x="823.8" y="204.9" class="ink" font-size="12.5" font-weight="700" text-anchor="middle" >measured turn speed</text><text x="823.8" y="220.9" class="ink" font-size="12.5" font-weight="700" text-anchor="middle" >at full push ≈ 365°/s</text><circle class="af" cx="383.9" cy="412" r="5"/><text x="395.9" y="416.0" class="ink" font-size="12" font-weight="400" text-anchor="start" >measured (each dot is a timed turn)</text><line class="g" x1="657.8" x2="685.8" y1="412" y2="412" stroke-width="2.5" stroke-dasharray="6 5"/><text x="693.8" y="416.0" class="ink" font-size="12" font-weight="400" text-anchor="start" >a perfect straight line</text></svg>